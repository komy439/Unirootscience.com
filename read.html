<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>uni root · read</title><meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.png">
<style>
@font-face{font-family:Ami;src:url(img/Amiri-Bold.woff) format('woff');font-weight:700}
:root{--gold:#f3cf7a}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,#211c14,#0b0907 55%,#000) fixed;color:#fff3d0;min-height:100vh;font-family:Inter,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(11,9,7,.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(243,207,122,.18)}
.t{flex:1;min-width:0;font-family:Ami,serif;font-size:20px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang=en] .t{font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:600}
.s{font-size:12px;color:#8c8270;white-space:nowrap}
.btn{font:600 13px Inter,system-ui,sans-serif;color:#0b0907;background:linear-gradient(#f6dc97,#d9b25a);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.lang{font:500 13px Inter,system-ui,sans-serif;color:var(--gold);border:1px solid rgba(243,207,122,.4);border-radius:999px;padding:6px 12px;background:none;cursor:pointer;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 30px;display:flex;flex-direction:column;gap:20px}
.pg{position:relative;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px rgba(243,207,122,.15);overflow:hidden;user-select:none;-webkit-user-select:none;aspect-ratio:210/297}
.pg img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-touch-callout:none}
.no{position:absolute;bottom:8px;inset-inline-start:12px;font-size:11px;color:#999}
.foot{text-align:center;font-size:12.5px;color:#8c8270;padding:6px 16px 46px;line-height:1.9}
.foot a{color:var(--gold)}
html[lang=ar] .foot{font-family:Ami,serif;font-size:16px}
.err{text-align:center;padding:80px 20px;color:#8c8270}
@media print{body{display:none}}
</style></head><body>
<div class="bar"><a class="btn" id="back" href="./"></a><div class="t" id="t"></div><span class="s" id="s"></span><button class="lang" id="lg" type="button"></button></div>
<div class="wrap" id="w"></div>
<div class="foot" id="f"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search),d=q.get('d'),l=q.get('l'),K='uniroot_lang';
  if(l!=='ar'&&l!=='en'){try{l=localStorage.getItem(K)}catch(e){}if(l!=='ar'&&l!=='en')l=(navigator.language||'').toLowerCase().indexOf('ar')===0?'ar':'en'}
  var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
  var AR=l==='ar',num=function(n){return AR?String(n).replace(/\d/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[c]}):String(n)};
  var back=document.getElementById('back');back.textContent=AR?'→ رجوع':'← Back';
  back.onclick=function(e){if(document.referrer&&document.referrer.indexOf(location.host)>=0&&history.length>1){e.preventDefault();history.back()}};
  document.getElementById('lg').textContent=AR?'English':'العربية';
  document.getElementById('lg').onclick=function(){var n=AR?'en':'ar';try{localStorage.setItem(K,n)}catch(e){}location.replace('read.html?d='+encodeURIComponent(d)+'&l='+n)};
  document.getElementById('f').innerHTML=AR?'© 2026 أحمد الكومي · uni root<br>للقراءة على الصفحة فقط · لطلب الملف <a href="./#contact">تواصل مع uni root</a>':'© 2026 Ahmed Elkomy · uni root<br>For reading on this page only · to request the file, <a href="./#contact">contact uni root</a>';
  fetch('read/docs.json').then(function(r){return r.json()}).then(function(D){
    var o=D[d];if(!o){document.getElementById('w').innerHTML='<div class="err">'+(AR?'الملف غير موجود.':'Not found.')+'</div>';return}
    var n=o.n[l]||o.n.ar;document.getElementById('t').textContent=o.t[l];document.title=o.t[l]+' · uni root';
    document.getElementById('s').textContent=AR?num(n)+(n>10?' صفحة':n>2?' صفحات':' صفحة'):n+(n>1?' pages':' page');
    var w=document.getElementById('w'),ll=o.n[l]?l:'ar';
    for(var i=1;i<=n;i++){var p=document.createElement('div');p.className='pg';var s=String(i).padStart(2,'0');
      p.innerHTML='<img src="read/'+d+'/'+ll+'/'+s+'.jpg" alt="" draggable="false" loading="'+(i<3?'eager':'lazy')+'"><span class="no" dir="ltr">'+i+' / '+n+'</span>';w.appendChild(p)}
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
  document.addEventListener('dragstart',function(e){e.preventDefault()});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['s','p','u'].indexOf(e.key.toLowerCase())>=0)e.preventDefault()});
})();
</script></body></html>
